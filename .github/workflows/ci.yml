name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  deployed-shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check deployed standalone app shell
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("app.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(Boolean); if(!scripts.length) throw new Error("No inline app scripts found"); fs.writeFileSync("/tmp/emenu-app-inline.js",scripts.join("\n"));'
          node --check /tmp/emenu-app-inline.js
  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run build
